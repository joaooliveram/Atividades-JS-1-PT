<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5 - Positivo ou Negativo</title>
</head>
<body>

    <h3>Verificar Sinal do Número</h3>
    <input type="number" id="numX" placeholder="Digite um número">
    
    <button onclick="disparar()">Verificar</button>
    
    <p id="resultado"></p>

    <script>
        function POSITIVO_NEGATIVO(x) {
            return x >= 0; 
        }
        function disparar() {
            const x = parseInt(document.getElementById("numX").value);
            if (isNaN(x)) {
                alert("Por favor, digite um número inteiro!");
                return;
            }
            const ePositivo = POSITIVO_NEGATIVO(x);
            document.getElementById("resultado").innerHTML = 
                "Retorno da função: <strong>" + ePositivo + "</strong><br>" +
                "Significado: O número é " + (ePositivo ? "Positivo (ou Zero)" : "Negativo");
        }
    </script>

</body>
</html>
